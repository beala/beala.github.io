name: Flasher

# Publishes fluxcore.party to Cloudflare: the landing page (landing/), the docs (flasher/docs) and the
# fluxcore flasher at /flash/ (the MeshCore web flasher, restyled), serving firmware from the beala-*
# releases of beala/MeshCore. Settings (devices, how many releases, flasher version) are in
# flasher/settings.json; the Cloudflare Worker is set up in wrangler.jsonc.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Workers edit permission) and CLOUDFLARE_ACCOUNT_ID.
# The old blog files at the top of this repo are not part of the site.

on:
  schedule:
    - cron: '*/15 * * * *'  # look for a new firmware release every 15 minutes
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['flasher/**', 'landing/**', 'worker.js', 'wrangler.jsonc', '.github/workflows/flasher.yml']

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scheduled runs only rebuild the site when there is a newer release than the one it serves
      - name: Check for a new release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO=$(jq -r .firmware_repo flasher/settings.json)
          PREFIX=$(jq -r .release_tag_prefix flasher/settings.json)
          # curl --retry only retries timeouts and HTTP 408, 429, 500, 502, 503, 504
          LATEST=$(curl -fsS --retry 3 --retry-delay 10 --retry-max-time 120 -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$REPO/releases?per_page=30" \
            | jq -r --arg p "$PREFIX" '[.[] | select(.draft | not) | select(.tag_name | startswith($p))] | sort_by(.published_at) | last | .tag_name')
          # firmware URLs on the site look like /flash/fw/<tag>/<file>
          SERVED=$(curl -fsS --retry 3 --retry-delay 10 --retry-max-time 120 "https://$(jq -r .site_host flasher/settings.json)/flash/releases" | jq -r '.[0].files[0].url' | cut -d/ -f4 || true)
          echo "latest release: $LATEST, site serves: ${SERVED:-nothing}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$LATEST" ] && [ "$LATEST" = "$SERVED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Get the flasher
        if: steps.check.outputs.skip != 'true'
        run: |
          REPO=$(jq -r .flasher_repo flasher/settings.json)
          COMMIT=$(jq -r .flasher_commit flasher/settings.json)
          git init -q _flasher
          git -C _flasher fetch -q --depth 1 "$REPO" "$COMMIT"
          git -C _flasher checkout -q FETCH_HEAD

      - name: Build site
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 flasher/build.py _flasher _site

      # Retry once: an upload that fails partway is safe to repeat (unchanged files are skipped)
      - name: Deploy to Cloudflare
        if: steps.check.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@4 deploy || { echo "deploy failed, retrying in 60 s"; sleep 60; npx -y wrangler@4 deploy; }
