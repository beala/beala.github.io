name: Flasher

# Publishes the MeshCore web flasher to GitHub Pages, serving firmware from the beala-* releases
# of beala/MeshCore. Settings (devices, how many releases, flasher version) are in flasher/settings.json.
# Only the flasher is published: the other files in this repo are not part of the site.

on:
  schedule:
    - cron: '*/15 * * * *'  # look for a new firmware release every 15 minutes
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['flasher/**', '.github/workflows/flasher.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      # Scheduled runs only rebuild the site when there is a newer release than the one it serves
      - name: Check for a new release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO=$(jq -r .firmware_repo flasher/settings.json)
          PREFIX=$(jq -r .release_tag_prefix flasher/settings.json)
          LATEST=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$REPO/releases?per_page=30" \
            | jq -r --arg p "$PREFIX" '[.[] | select(.draft | not) | select(.tag_name | startswith($p))][0].tag_name')
          # firmware URLs on the site look like /fw/<tag>/<file>
          SERVED=$(curl -fsS "https://$(jq -r .site_host flasher/settings.json)/releases" | jq -r '.[0].files[0].url' | cut -d/ -f3 || true)
          echo "latest release: $LATEST, site serves: ${SERVED:-nothing}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$LATEST" ] && [ "$LATEST" = "$SERVED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Get the flasher
        if: steps.check.outputs.skip != 'true'
        run: |
          REPO=$(jq -r .flasher_repo flasher/settings.json)
          COMMIT=$(jq -r .flasher_commit flasher/settings.json)
          git init -q _flasher
          git -C _flasher fetch -q --depth 1 "$REPO" "$COMMIT"
          git -C _flasher checkout -q FETCH_HEAD

      - name: Build site
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 flasher/build.py _flasher _site

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.skip != 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
